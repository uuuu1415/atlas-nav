<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#eff1f7" />
    <title>Atlas / 个人工作台</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="home">
    <div class="grain"></div>
    <main class="shell">
      <header class="masthead">
        <a class="brand" href="/"
          ><img id="site-logo" alt="" /><span id="brand-name">ATLAS</span
          ><span id="brand-icon">•</span></a
        >
        <div class="head-actions">
          <button id="lang-toggle" class="icon-button" aria-label="切换语言">
            中 / EN
          </button>
          <div class="layout-picker">
            <button
              id="layout-toggle"
              class="icon-button"
              aria-label="切换页面排布"
              title="页面排布"
            >
              ▦
            </button>
            <div id="layout-menu" class="layout-menu" hidden>
              <button data-layout="standard">标准双列</button
              ><button data-layout="compact">紧凑排布</button
              ><button data-layout="columns">分栏排布</button>
            </div>
          </div>
          <button id="theme" class="icon-button" aria-label="切换颜色主题">◐</button
          ><a id="admin-label" class="admin-link" href="/admin">管理</a>
        </div>
      </header>
      <section class="welcome">
        <p id="date-line" class="eyebrow"></p>
        <h1 id="page-title" class="page-title">导航页</h1>
        <div class="search-wrap">
          <span class="search-icon">⌕</span
          ><input
            id="search"
            autocomplete="off"
            placeholder="搜索本站的工具与服务…"
            aria-label="搜索导航"
          />
          <div class="search-mode-picker">
            <button
              id="search-mode"
              class="search-mode"
              type="button"
              aria-label="选择搜索模式"
              aria-expanded="false"
            >
              <span class="mode-dot"></span><span id="search-mode-label">本站</span
              ><span class="mode-chevron">⌄</span>
            </button>
            <div id="search-menu" class="search-menu" hidden>
              <button type="button" data-mode="local">
                <span class="menu-dot"></span>本站搜索</button
              ><button type="button" data-mode="bing">
                <span class="menu-bing">b</span>Bing 搜索
              </button>
            </div>
          </div>
          <kbd>/</kbd>
        </div>
        <p id="result-note" class="hint">
          按 <b>/</b> 立即搜索 · <b>↵</b> 打开第一个结果
        </p>
      </section>
      <nav id="category-nav" class="category-nav" aria-label="分类导航"></nav>
      <section id="recent-area" class="pinned-area" hidden>
        <div class="section-rule"><span id="recent-title">最近使用</span></div>
        <div id="recent" class="pinned-grid"></div>
      </section>
      <section id="pinned-area" class="pinned-area">
        <div class="section-rule"><span id="pinned-title">置顶入口</span></div>
        <div id="pinned" class="pinned-grid"></div>
      </section>
      <section id="catalog" class="catalog"></section>
      <footer>
        <span id="footer-title">Atlas / 个人工作台</span
        ><span id="footer-copy">你的数字坐标</span>
      </footer>
    </main>
    <template id="link-card"
      ><a class="link-card" target="_blank" rel="noopener noreferrer"
        ><span class="service-icon"></span
        ><span class="link-copy"><strong></strong><small></small></span
        ><span class="arrow">↗</span></a
      ></template
    >
    <script type="module" src="/js/home.js"></script>
    <script>
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
  </body>
</html>
