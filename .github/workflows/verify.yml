name: Verify

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node --check server.js
      - run: node --check public/admin.js
      - run: node --check public/js/home.js
      - run: node --check public/js/shared.js
      - run: bash -n deploy/install.sh
      - run: npm test
